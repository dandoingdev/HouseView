  HOUSEVIEW BROWSER SUITE (tests/browser.html).
  The main browser regression suite of the product: it drives the real bundle through its public surface
  (setConfig, hass, the shadow DOM, the editors) with a mock Home Assistant and reports each check as an <li>.
  `npm run test:browser` runs it against dist, `npm run test:browser:min` against the minified production

-->
