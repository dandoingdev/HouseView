<!doctype html><html lang="en"><meta charset="utf-8"><title>HouseView playlist browser</title>
<style>body{margin:0;background:#073c40;font-family:system-ui}#summary,#results{background:white;color:#152c30;padding:16px;margin:0}#stage{height:800px;width:1280px}houseview-card{display:block;height:100%;width:100%}body.preview #summary,body.preview #results{display:none}body.preview #stage{width:100vw;height:100vh}body.preview{overflow:hidden}</style>
<p id="summary">Running…</p><ol id="results"></ol><div id="stage"></div>
<script type="module">

import {mediaKey} from '../src/widgets/media_player/library-data.js';
customElements.define('ha-form',class extends HTMLElement{});
customElements.define('ha-icon',class extends HTMLElement{connectedCallback(){if(this.shadowRoot)return;const paths={'alert-circle-outline':'M12 22a10 10 0 100-20 10 10 0 000 20M12 6v7M12 17h.01','information-outline':'M12 22a10 10 0 100-20 10 10 0 000 20M12 11v6M12 7h.01','window-closed-variant':'M3 3h18v18H3zM12 3v18M3 12h18','lock-outline':'M5 10h14v11H5zM8 10V6a4 4 0 018 0v4M12 14v3','thermostat':'M9 14V5a3 3 0 016 0v9a5 5 0 11-6 0M12 7v10','shield-check-outline':'M12 2l9 4v6c0 6-9 10-9 10S3 18 3 12V6zM8 11l3 3 5-5','home-outline':'M3 10l9-7 9 7v11H3zM9 21v-8h6v8','home-export-outline':'M3 10l9-7 9 7M5 9v12h8M15 15h7M19 12l3 3-3 3','weather-sunset':'M3 18h18M5 15a7 7 0 0114 0M12 3v3M3 8l2 2M21 8l-2 2','check-circle':'M21 12a9 9 0 11-3-7M8 11l4 4L22 4','close':'M5 5l14 14M19 5L5 19','chevron-left':'M15 5l-7 7 7 7','chevron-right':'M9 5l7 7-7 7','refresh':'M20 11a8 8 0 10-2 7M20 4v7h-7','playlist-music':'M4 6h12M4 11h12M4 16h7M20 10v9a2 2 0 11-2-2h2','format-list-bulleted':'M9 6h12M9 12h12M9 18h12M3 6h1M3 12h1M3 18h1','play':'M8 5l11 7-11 7z','pause':'M8 5v14M16 5v14','chevron-down':'M5 9l7 7 7-7','lightbulb-group-outline':'M9 18h6M10 21h4M9 15c0-2-3-3-3-6a6 6 0 1112 0c0 3-3 4-3 6z','account-group-outline':'M8 11a4 4 0 100-8 4 4 0 000 8M2 21v-3c0-5 12-5 12 0v3M17 4a3 3 0 010 6M18 14c4 0 4 3 4 6','weather-night':'M20 15A8 8 0 019 4a8 8 0 1011 11','script-text-play-outline':'M5 3h14v14M5 3v18h8M9 7h6M9 11h6M17 16l5 3-5 3z','palette-outline':'M12 3a9 9 0 100 18h2a2 2 0 000-4h-1a2 2 0 010-4h5a3 3 0 003-3c0-4-5-7-9-7M7 8h.01M12 6h.01M17 8h.01M5 13h.01','power':'M12 2v10M6 5a9 9 0 1012 0','toggle-switch-outline':'M8 6h8a6 6 0 010 12H8A6 6 0 018 6M8 10a2 2 0 100 4 2 2 0 000-4','music-note':'M15 3v13a4 4 0 11-4-4h4M15 3l6 3','rewind':'M11 5l-8 7 8 7zM21 5l-8 7 8 7z','fast-forward':'M3 5l8 7-8 7zM13 5l8 7-8 7z'};const icon=this.getAttribute('icon')?.replace('mdi:','');this.attachShadow({mode:'open'}).innerHTML=`<style>:host{display:inline-flex;width:var(--mdc-icon-size,24p let failures=0,count=0;const calls=[],reads=[];let failBrowse=false,failPlay=false,resolveRead;
const songs=Array.from({length:9},(_,i)=>({title:['Kitchen favourites','Sunday morning','After dark','Slow cooking','Coffee & jazz','Evening radio','Weekend','Quiet hours','Dinner party'][i],media_content_id:`FV:${i}`,media_content_type:'favorite_item_id',can_play:true,can_expand:false,thumbnail:'/api/media_player_proxy/demo/browse_media/art/'+i}));
const check=(name,ok)=>{count++;if(!ok)failures++;const li=document.createElement('li');li.textContent=(ok?'PASS':'FAIL')+' — '+name+(!ok?' observed '+JSON.stringify({calls:calls.length,reads:reads.length,tracks:card.shadowRoot?.querySelectorAll('.mt-track').length,message:card.shadowRoot?.querySelector('.media-tracks .ml-empty')?.textContent,focus:card.shadowRoot?.activeElement?.dataset.action,scroll:card.shadowRoot?.querySelector('.mt-content')?.scrollTop}):'');document.querySelector('#results').append(li);};
const hass={connection:{},config:{unit_system:{temperature:'°C'}},states:{'media_player.test':{state:'idle',attributes:{friendly_name:'Kitchen · Sonos',supported_features:131072|512|4}}},callWS:async(m)=>{reads.push(m);if(failBrowse)throw Error('Offline');if(resolveRead)return new Promise(r=>{resolveRead=r;});return {children:songs};},callService:async(d,s,data)=>{calls.push({d,s,data});if(failPlay)throw Error('Denied');}};
const config=(extra={})=>({tablet_mode:preview,bedtime:true,pages:[{name:'Music'}],widgets:[{type:'media_player',entity:'media_player.test',page:'Music',...extra}]});
const wait=()=>new Promise(r=>setTimeout(r,50));
const q=s=>card.shadowRoot.querySelector(s);const click=async action=>{q(`[data-action="${action}"]`).click();await wait();};
try{
card.setConfig(config());card.hass=hass;await wait();check('No browsing or services just from displaying the player',reads.length===0&&calls.length===0);
await click('media-player-browse-0');check('Browse opens a full-height library without playback',!!q('.media-library')&&calls.length===0&&q('.ml-grid').children.length===6);check('A library blocks page navigation and idle screensavers',card._navigationBlocked()&&card._screensaverBlockedFor({}));
check('Playlist artwork loads the browse thumbnail without sending a page referrer',q('.ml-item img')?.referrerPolicy==='no-referrer'&&q('.ml-item img').getAttribute('src').includes('/api/media_player_proxy/'));
check('Library icons are centred inside their artwork and navigation buttons',[...q('.media-library').querySelectorAll('ha-icon')].every(icon=>{const a=icon.getBoundingClientRect(),b=icon.parentElement.getBoundingClientRect();return Math.abs((a.left+a.right-b.left-b.right)/2)<1&&Math.abs((a.top+a.bottom-b.top-b.bottom)/2)<1;}));
check('Artwork fills the tile width with the playlist name below',[...q('.ml-grid').children].every(tile=>{const art=tile.querySelector('.ml-art').getBoundingClientRect(),name=tile.querySelector('strong').getBoundingClientRect(),r=tile.getBoundingClientRect();return art.width>r.width*.85&&name.top>=art.bottom&&!tile.querySelector('small');}));
const original=q('.ml-item');hass.states['media_player.test']={state:'playing',attributes:{...hass.states['media_player.test'].attributes,media_title:'An update'}};card.hass={...hass};check('Live updates preserve playlist tiles and artwork',q('.ml-item')===original);
await click('media-player-library-next');check('Pagination shows the remaining favourites without scrolling',q('.ml-grid').children.length===3&&q('.ml-item strong').textContent==='Weekend');await click('media-player-library-prev');
await click('media-player-library-play-1');check('Only an explicit playlist press starts exactly the selected item on the selected speaker',calls.length===1&&calls[0].d==='media_player'&&calls[0].s==='play_media'&&calls[0].data.entity_id==='media_player.test'&&calls[0].data.media_content_id==='FV:1'&&calls[0].data.media_content_type==='favorite_item_id');
check('A successful playlist starts on the same player page and closes the library',!q('.media-library')&&!!q('.music-panel')&&card.shadowRoot.activeElement?.dataset.action==='media-player-browse-0');
await click('media-player-browse-0');await click('media-player-library-close');check('Back restores focus to Browse',!q('.media-library')&&card.shadowRoot.activeElement?.dataset.action==='media-player-browse-0');
card.setConfig(config({playlist_mode:'selected',playlists:[mediaKey(songs[2]),mediaKey(songs[0])]}));card.hass=hass;await click('media-player-browse-0');check('Curated selection is exclusive and retains configured order',[...q('.ml-grid').querySelectorAll('strong')].map(n=>n.textContent).join('|')==='After dark|Kitchen favourites');
await card._act('media-player-library-play-8','media_player.test');check('An unshown item cannot be played by a forged index',calls.length===1);
const editor=document.createElement('houseview-widget-editor');editor.hass=hass;editor.setConfig({type:'custom:houseview-media_player-card',entity:'media_player.test',playlist_mode:'selected',playlists:[mediaKey(songs[2])]});document.body.append(editor);await wait();const form=editor.shadowRoot.querySelector('ha-form');check('Settings use the native draggable multiple selector',form.schema.find(f=>f.name==='playlists')?.selector.select.reorder===true&&form.schema.find(f=>f.name==='playlists').selector.select.options.length===9);let saved;editor.addEventListener('config-changed',e=>saved=e.detail.config);form.dispatchEvent(new CustomEvent('value-changed',{detail:{value:{...form.data,playlists:[mediaKey(songs[1]),mediaKey(songs[0])]}},bubbles:true}));check('Native form changes preserve entity and ordered mapping without playback',saved?.entity==='media_player.test'&&saved.playlists[0]===mediaKey(songs[1])&&calls.length===1);editor.remove();
await click('media-player-library-close');card.setConfig(config({playlist_mode:'selected',playlists:[]}));card.hass=hass;await click('media-player-browse-0');check('An empty curated selection never falls back to all favourites',!!q('.ml-empty')&&!q('.ml-item'));
await click('media-player-library-close');failBrowse=true;await click('media-player-browse-0');check('Browse failures offer a recoverable empty state without playback',q('.ml-empty').textContent.includes('Could not load')&&calls.length===1);failBrowse=false;await click('media-player-library-refresh');check('Refresh recovers without changing the saved empty selection',q('.ml-empty').textContent.includes('No playlists'));
await click('media-player-library-close');card.setConfig(config());card.hass=hass;await click('media-player-browse-0');failPlay=true;await click('media-player-library-play-0');check('Selecting a playlist closes the library and a failed start is shown on the player',!q('.media-library')&&q('.feedback').textContent.includes('Denied')&&!card._pending.size);failPlay=false;
const before=reads.length;card.setConfig(config());card.hass={...hass,states:{'media_player.test':{state:'unavailable',attributes:{supported_features:131072|512}}}};await wait();check('An unavailable speaker cannot open Browse',q('[data-action="media-player-browse-0"]')?.disabled!==false&&reads.length===before);
card.hass=hass;card.setConfig(config());await click('media-player-browse-0');card.shadowRoot.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await wait();check('Escape closes without playing anything else',!q('.media-library')&&calls.length===2);
await click('media-player-browse-0');const normalService=hass.callService;let acceptPlayback;hass.callService=()=>new Promise(resolve=>{acceptPlayback=resolve;});const pendingPlayback=card._act('media-player-library-play-0','media_player.test');await wait();check('Selecting a playlist closes the library while playback is still pending',!q('.media-library')&&!!q('.music-panel'));acceptPlayback();await pendingPlayback;check('Accepted playback restores focus to the player',!q('.media-library')&&!!q('.music-panel')&&card.shadowRoot.activeElement?.dataset.action==='media-player-browse-0');hass.callService=normalService;


// Track picking reads the live Sonos queue; it never replaces that queue with a single track.
card.setConfig(config());card.hass=hass;await click('media-player-show-tracks-0');
check('Before choosing a playlist, tracks explain where to start without playback',q('.media-tracks .ml-empty').textContent.includes('Browse first'));
await click('media-player-tracks-close');
const normalBrowse=hass.callWS;
let queue=Array.from({length:18},(_,i)=>({media_title:i===0?'<img src=x onerror=alert(1)>':`Track ${i+1}`,media_artist:'The House Band',media_album_name:'Evening sessions',media_content_id:`synthetic:track:${i}`}));
let queueReads=0,failQueue=false,lateQueue;
hass.services={sonos:{get_queue:{},play_queue:{}}};hass.entities={'media_player.test':{platform:'sonos'}};
hass.callWS=async m=>{if(m.service!=='get_queue')return normalBrowse(m);queueReads++;if(failQueue)throw Error('Offline');if(lateQueue)return new Promise(r=>{lateQueue=r;});return {response:{'media_player.test':queue}};};
hass.states['media_player.test']={state:'playing',attributes:{...hass.states['media_player.test'].attributes,queue_size:18,queue_position:2,media_playlist:'Evening sessions',media_content_id:'synthetic:track:1'}};card.hass={...hass};
const beforeTracks=calls.length;
await click('media-player-show-tracks-0');
check('The cover list button opens live tracks through a read-only response request',q('.mt-list').children.length===18&&queueReads===1&&calls.length===beforeTracks);
check('Track names are escaped and current Sonos position is one-based',!q('.mt-track img')&&q('.mt-track[aria-current]').dataset.action==='media-player-track-play-1');
check('Tracks block dashboard navigation and idle screensavers',card._navigationBlocked()&&card._screensaverBlockedFor({}));
const row=q('.mt-track'),scroller=q('.mt-content');row.focus({preventScroll:true});scroller.scrollTop=200;
hass.states['media_player.test']={...hass.states['media_player.test'],attributes:{...hass.states['media_player.test'].attributes,queue_position:3}};card.hass={...hass};
check('Playback updates preserve track nodes, scroll and keyboard focus',q('.mt-track')===row&&q('.mt-content').scrollTop===200&&card.shadowRoot.activeElement===row&&q('.mt-track[aria-current]').dataset.action==='media-player-track-play-2');
await card._act('media-player-track-play-999','media_player.test');await card._act('media-player-track-play-1','media_player.other');
check('Forged track indexes and other speakers cannot start playback',calls.length===beforeTracks);
await click('media-player-track-play-4');
check('Picking a track jumps to its zero-based queue position without replacing the playlist',calls.length===beforeTracks+1&&calls.at(-1).d==='sonos'&&calls.at(-1).s==='play_queue'&&calls.at(-1).data.queue_position===4&&calls.at(-1).data.entity_id==='media_player.test'&&queueReads===2&&!q('.media-tracks'));
check('After choosing a track focus returns to the artwork list button',card.shadowRoot.activeElement?.dataset.action==='media-player-show-tracks-0');
await click('media-player-show-tracks-0');queue=[...queue];queue[4]={...queue[4],media_content_id:'synthetic:replacement'};await click('media-player-track-play-4');
check('A queue edited elsewhere cannot play a stale index',calls.length===beforeTracks+1&&q('.media-tracks .ml-empty').textContent.includes('playlist changed'));
await click('media-player-tracks-refresh');check('Refresh recovers from an edited queue',!!q('.mt-list'));
await click('media-player-tracks-close');failQueue=true;await click('media-player-show-tracks-0');check('A failed queue read keeps playback untouched and offers Refresh',q('.media-tracks .ml-empty').textContent.includes('Could not load tracks')&&calls.length===beforeTracks+1);failQueue=false;await click('media-player-tracks-refresh');
check('Retry loads tracks without starting music',!!q('.mt-list')&&calls.length===beforeTracks+1);
card.shadowRoot.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await wait();check('Escape closes tracks and restores cover focus',!q('.media-tracks')&&card.shadowRoot.activeElement?.dataset.action==='media-player-show-tracks-0');
queue=[];await click('media-player-show-tracks-0');check('An empty queue explains playlist and radio support',q('.media-tracks .ml-empty').textContent.includes('No tracks available'));await click('media-player-tracks-close');
lateQueue=true;await click('media-player-show-tracks-0');const finishQueue=lateQueue;await click('media-player-tracks-close');finishQueue({response:{'media_player.test':queue}});lateQueue=null;await wait();check('Late reads after closing cannot reopen the picker or play',!q('.media-tracks')&&calls.length===beforeTracks+1);
queue=[{media_title:'Reconnected',media_content_id:'synthetic:reconnected'}];await click('media-player-show-tracks-0');card.remove();await wait();document.querySelector('#stage').append(card);card.hass=hass;await wait();check('Disconnect discards track data and an open picker',!q('.media-tracks')&&!card._ext.media_player.tracks);await click('media-player-show-tracks-0');check('Reconnecting can load fresh tracks',q('.mt-label strong').textContent==='Reconnected');await click('media-player-tracks-close');
await click('media-player-show-tracks-0');card.setConfig(config({name:'Changed configuration'}));card.hass=hass;await wait();check('Configuration changes invalidate the open picker',!q('.media-tracks'));
// Generic media browsers retain the selected expandable playlist for this widget only.
hass.services={};hass.entities={};hass.states['media_player.test']={state:'playing',attributes:{friendly_name:'Generic speaker',supported_features:131072|512|4}};
hass.callWS=async m=>m.media_content_id==='expandable'?{children:[{title:'A chosen song',media_content_type:'music',media_content_id:'synthetic:chosen',can_play:true,can_expand:false}]}:{children:[{title:'A browsable playlist',media_content_id:'expandable',media_content_type:'playlist',can_play:true,can_expand:true}]};
card.setConfig(config());card.hass=hass;await click('media-player-browse-0');await click('media-player-library-play-0');await click('media-player-show-tracks-0');check('Generic players browse only the explicitly selected playlist',q('.mt-label strong').textContent==='A chosen song');await click('media-player-track-play-0');check('Generic track playback uses the exact returned media ID and type',calls.at(-1).data.media_content_id==='synthetic:chosen'&&calls.at(-1).data.media_content_type==='music');
hass.callWS=normalBrowse;

}catch(e){check('Unexpected exception: '+e.stack,false);}
document.querySelector('#summary').textContent=`${count-failures} passed; ${failures} failed.`;

card.setConfig(config());card.hass=hass;await click('media-player-browse-0');
</script></html>
