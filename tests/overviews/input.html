<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>HouseView screensaver: real input host</title>
<body style="margin: 0; background: #333">
<script type="module">
  // Host page for tests/overviews/screensaver-input.mjs (docs/overview-api.md): the real bundle, a mock hass and a
  // fake clock. The script drives it with a real mouse and keyboard; this page only offers the small API below.
  //
  //   window.mount(screensaver, {editMode, editHost})   a fresh <houseview-card>: two pages, two light widgets on the first, this screensaver block
  //   window.advance(seconds)                 move the fake clock and fire the shared ticker once per second
  //   window.calls                          service calls as ['light:light.a', ...]; window.resetCalls
  //   window.intervals                        the fake intervals still registered (0 once every card is gone)
  //   window.probe                            what the script may ask about the weather scene
  //
  // `?src=/dist/houseview.js` loads another bundle.
  const params = new URLSearchParams(location.search);

  // ---- the fake clock: Date.now and setInterval are ours, setTimeout stays real (the fade is real time) ----
  window.fake = {now: Date.parse('2026-10-15T09:10:00Z')};
  Date.now = () => window.fake.now;
  const intervals = new Map();
  let nextId = 5_000_000;
  // Every interval is ours. (puppeteer polls with requestAnimationFrame, so it needs no real one.)
  window.setInterval = (fn, ms = 0, ...args) => {
    intervals.set(++nextId, () => fn(...args));
    return nextId;
  };
  window.clearInterval = (id) => intervals.delete(id);
  window.intervals = intervals;
  window.advance = (seconds) => {
    for (let i = 0; i < seconds; i++) {
      window.fake.now += 1000;
      for (const run of [...intervals.values()]) run();
    }
  };

  const {createMockHass} = await import('../fixtures/mock-hass.js');
  const {defineDoubles} = await import('../widgets/harness.js');
  const {variants} = await import('../../src/overviews/weather/fixtures.js');
  defineDoubles();
  await import(params.get('src') || '/dist/houseview.js');

  const variant = variants.ok;
  let mock;
  window.calls = () => mock.calls.map((c) => `${c.d}:${c.data?.entity_id}`);
  window.resetCalls = () => {
    mock.calls.length = 0;
  };
  window.mount = async (screensaver, {editMode = false, editHost = 'hui-card-options', hass = {}} = {}) => {
    document.body.replaceChildren();
    mock = createMockHass({
      ...variant.hass,
      ...hass,
      connection: true,
      states: {
        ...variant.states,
        'light.a': {state: 'on', attributes: {friendly_name: 'Light A'}},
        'light.b': {state: 'off', attributes: {friendly_name: 'Light B'}}
      }
    });
    // forecasts are answered at once, like Home Assistant's first event
    mock.hass.connection.subscribeMessage = (callback, msg) => {
      const forecast = variant.forecasts?.[msg.forecast_type];
      queueMicrotask(() => callback({type: msg.forecast_type, forecast: forecast ?? null}));
      return Promise.resolve(() => {});
    };
    window.mock = mock;
    const card = document.createElement('houseview-card');
    card.style.cssText = 'display:block;height:100vh';
    // two pages, so a swipe that reached the controller would turn one
    const config = {
      preview_time: variant.config.preview_time,
      pages: [{name: 'Home'}, {name: 'More'}],
      cards: [
        {type: 'custom:houseview-light-card', entity: 'light.a', page: 'Home'},
        {type: 'custom:houseview-light-card', entity: 'light.b', page: 'Home'},
        {type: 'custom:houseview-clock-card', page: 'More'}
      ]
    };
    if (screensaver !== undefined) config.screensaver = screensaver;
    if (editMode) {
      const wrapper = document.createElement(editHost); // what Home Assistant puts around a card being edited (hui-card-options) or previews (hui-card-preview)
      document.body.append(wrapper);
      wrapper.append(card);
    } else document.body.append(card);
    window.card = card;
    card.setConfig(config);
    card.hass = mock.hass;
    await new Promise((resolve) => setTimeout(resolve, 60));
    return card;
  };

  // ---- the weather scene, as far as the script needs to know ----
  const root = () => window.card.shadowRoot;
  window.probe = {
    sceneReady: () =>
      root().querySelector('.ov-temp')?.textContent === '12°' &&
      root().querySelector('.ov-time')?.textContent.includes('10:09'),
    detailCount: () => root().querySelectorAll('.ov-detail').length,
    timeText: () => root().querySelector('.ov-time')?.textContent ?? '',
    /** Change the humidity in the mock and hand hass back; returns the text now shown. */
    bumpHumidity() {
      window.__scene = root().querySelector('.ov-weather-scene');
      // Home Assistant pushes a NEW state object for a change; in-place edits are invisible to reference compare
      const current = window.mock.hass.states['weather.test'];
      window.mock.replaceState('weather.test', {
        ...current,
        attributes: {...current.attributes, humidity: 55}
      });
      window.card.hass = {...window.mock.hass};
      return root().querySelector('[data-detail="humidity"] .ov-detail-value')?.textContent;
    },
    sameSceneNode: () => window.__scene === root().querySelector('.ov-weather-scene'),
    /** Let ctx.now follow the fake clock, parked at 10:09:30. */
    followClock() {
      window.card._config.preview_time = undefined;
      window.fake.now = Date.parse('2026-10-15T10:09:30+01:00');
    }
  };
  window.ready = true;
</script>
</body>
</html>
