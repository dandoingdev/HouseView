<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>HouseView automatic displays: real input host</title>
<body style="margin: 0; background: #333">
<script type="module">
  // Host page for tests/overviews/automatic-input.mjs: the real bundle, a mock hass with a timer, a speaker and a
  // weather entity, and a fake clock. The script drives it with a real mouse; this page only offers the small API below.
  //
  //   window.mount({cards, screensaver, config})  a fresh <houseview-card>: two light widgets plus the cards named in
  //                                               `cards` ('timer', 'music'), the screensaver block (omitted = none)
  //   window.setTimer(state, {left, total})       a NEW timer state object, like Home Assistant, then a NEW hass
  //   window.setPlayer(state, attributes)         the same for the speaker
  //   window.advance(seconds)                     move the fake clock and fire the shared ticker once per second
  //   window.calls / window.resetCalls        service calls as ['light:toggle:light.a', ...]
  //   window.cycle(n, opts)                       n create / activate / remove cycles; returns what is still registered
  //   window.probe                                what the script may ask about the layer
  //
  // `?src=/dist/houseview.js` loads another bundle.
  const params = new URLSearchParams(location.search);
  const realSetTimeout = window.setTimeout.bind(window);
  const realClearTimeout = window.clearTimeout.bind(window);

  // ---- the fake clock: Date.now and setInterval are ours; setTimeout stays real (the fade is real time) ----
  window.fake = {now: Date.parse('2026-10-15T10:09:00+01:00')};
  Date.now = () => window.fake.now;
  const intervals = new Map();
  let nextId = 5_000_000;
  window.setInterval = (fn, ms = 0, ...args) => {
    intervals.set(++nextId, () => fn(...args));
    return nextId;
  };
  window.clearInterval = (id) => intervals.delete(id);
  window.advance = (seconds) => {
    for (let i = 0; i < seconds; i++) {
      window.fake.now += 1000;
      for (const run of [...intervals.values()]) run();
    }
  };

  // ---- leak accounting: pending real timeouts, and listeners on the long-lived targets ----
  const pending = new Set();
  window.setTimeout = (fn, ms, ...args) => {
    const id = realSetTimeout(
      (...a) => {
        pending.delete(id);
        return typeof fn === 'function' ? fn(...a) : undefined;
      },
      ms,
      ...args
    );
    pending.add(id);
    return id;
  };
  window.clearTimeout = (id) => {
    pending.delete(id);
    return realClearTimeout(id);
  };
  const listeners = new Map();
  const ids = new WeakMap();
  let nextListener = 0;
  const idOf = (fn) => {
    if (!ids.has(fn)) ids.set(fn, ++nextListener);
    return ids.get(fn);
  };
  const label = (t) => (t === window ? 'window' : t === document ? 'document' : null);
  const keyOf = (type, fn, opts) =>
    `${type}|${typeof fn === 'function' ? idOf(fn) : idOf(fn.handleEvent)}|${typeof opts === 'object' ? !!opts?.capture : !!opts}`;
  const add = EventTarget.prototype.addEventListener;
  const remove = EventTarget.prototype.removeEventListener;
  EventTarget.prototype.addEventListener = function (type, fn, opts) {
    const l = label(this);
    if (l && fn) {
      if (!listeners.has(l)) listeners.set(l, new Set());
      listeners.get(l).add(keyOf(type, fn, opts));
    }
    return add.call(this, type, fn, opts);
  };
  EventTarget.prototype.removeEventListener = function (type, fn, opts) {
    const l = label(this);
    if (l && fn) listeners.get(l)?.delete(keyOf(type, fn, opts));
    return remove.call(this, type, fn, opts);
  };
  const listenerCount = () => [...listeners.values()].reduce((n, s) => n + s.size, 0);

  const {createMockHass} = await import('../fixtures/mock-hass.js');
  const {defineDoubles} = await import('../widgets/harness.js');
  const {variants} = await import('../../src/overviews/weather/fixtures.js');
  const {ART, ART_NEXT} = await import('../../src/overviews/cover_art/fixtures.js');
  defineDoubles();
  await import(params.get('src') || '/dist/houseview.js');
  window.ART = ART;
  window.ART_NEXT = ART_NEXT;

  const weather = variants.ok;
  const subs = {open: 0};
  let mock;
  window.calls = () => mock.calls.map((c) => `${c.d}:${c.s}:${c.data?.entity_id}`);
  window.resetCalls = () => {
    mock.calls.length = 0;
  };

  const TIMER = 'timer.kitchen';
  const PLAYER = 'media_player.living_room';
  const hms = (s) =>
    `${Math.floor(s / 3600)}:${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  const speaker = (state, attributes = {}) => ({
    state,
    attributes: {
      friendly_name: 'Living room',
      media_title: 'Questions',
      media_artist: 'Maisie Peters',
      entity_picture: ART,
      supported_features: 0,
      ...attributes
    }
  });

  const CARDS = {
    timer: {type: 'custom:houseview-timer-card', entity: TIMER},
    music: {type: 'custom:houseview-media_player-card', entity: PLAYER}
  };

  function build({cards = [], screensaver, config = {}, player = 'idle'} = {}) {
    mock = createMockHass({
      ...weather.hass,
      connection: true,
      states: {
        ...weather.states,
        'weather.home': structuredClone(weather.states['weather.test']),
        'light.a': {state: 'on', attributes: {friendly_name: 'Light A'}},
        'light.b': {state: 'off', attributes: {friendly_name: 'Light B'}},
        [TIMER]: {state: 'idle', attributes: {friendly_name: 'Kitchen timer', duration: '0:15:00', editable: true}},
        [PLAYER]: speaker(player)
      }
    });
    mock.hass.connection.subscribeMessage = (callback, msg) => {
      queueMicrotask(() => callback({type: msg.forecast_type, forecast: weather.forecasts?.[msg.forecast_type] ?? null}));
      subs.open++;
      let closed = false;
      return Promise.resolve(() => {
        if (!closed) subs.open--;
        closed = true;
      });
    };
    window.mock = mock;
    const card = document.createElement('houseview-card');
    card.style.cssText = 'display:block;height:100vh';
    const full = {
      pages: [{name: 'Home'}],
      cards: [
        {type: 'custom:houseview-light-card', entity: 'light.a', page: 'Home'},
        {type: 'custom:houseview-light-card', entity: 'light.b', page: 'Home'},
        ...cards.map((name) => ({...CARDS[name], page: 'Home'}))
      ],
      ...config
    };
    if (screensaver !== undefined) full.screensaver = screensaver;
    document.body.append(card);
    window.card = card;
    window.lastConfig = full;
    card.setConfig(full);
    card.hass = mock.hass;
    return card;
  }

  window.mount = async (opts) => {
    document.body.replaceChildren();
    const card = build(opts);
    await new Promise((resolve) => realSetTimeout(resolve, 60));
    return card;
  };
  // Home Assistant pushes a NEW state object for a change, and a NEW hass object that keeps the same connection
  const push = () => {
    window.card.hass = {...window.mock.hass};
  };
  window.setTimer = (state, {left = 900, total = 900} = {}) => {
    const attributes = {friendly_name: 'Kitchen timer', duration: hms(total), editable: true};
    if (state === 'active') {
      attributes.remaining = hms(Math.max(0, left));
      attributes.finishes_at = new Date(window.fake.now + left * 1000).toISOString();
    } else if (state === 'paused') attributes.remaining = hms(left);
    window.mock.replaceState(TIMER, {state, attributes});
    push();
  };
  window.setPlayer = (state, attributes = {}) => {
    const current = window.mock.hass.states[PLAYER];
    window.mock.replaceState(PLAYER, {
      state,
      attributes: {...current.attributes, ...attributes}
    });
    push();
  };
  window.setHidden = (hidden) => {
    Object.defineProperty(document, 'hidden', {configurable: true, get: () => hidden});
    document.dispatchEvent(new Event('visibilitychange'));
  };

  window.cycle = async (n, opts) => {
    const out = {};
    for (let i = 0; i < n; i++) {
      document.body.replaceChildren();
      const card = build(opts);
      window.setPlayer('playing');
      window.advance(i % 2 ? 125 : 6); // an idle layer (cover art or weather) on every cycle
      if (i % 3 === 0) window.setTimer('active', {left: 600});
      window.advance(1);
      if (i % 4 === 0) card.shadowRoot.querySelector('.hv-screensaver .ov-dismiss')?.click();
      if (i === 4) out.listenersAfterWarmup = listenerCount();
      card.remove();
      document.body.replaceChildren();
    }
    out.listeners = listenerCount();
    return out;
  };
  window.leaks = () => ({
    intervals: intervals.size,
    timeouts: pending.size,
    listeners: listenerCount(),
    subscriptions: subs.open
  });

  const root = () => window.card.shadowRoot;
  window.probe = {
    layer: () => {
      const l = root().querySelector('.hv-screensaver');
      return l
        ? {state: l.dataset.state, kind: l.dataset.screensaver, img: l.querySelector('.ov-cover_art-img')?.getAttribute('src') ?? null, title: l.querySelector('.ov-cover_art-title')?.textContent ?? null}
        : null;
    },
    layers: () => root().querySelectorAll('.hv-screensaver').length,
    hasScreensaver: () => window.card._screensaver != null,
    entries: () => (window.card._screensaver?.entries ?? []).map((e) => `${e.overview.type}${e.implicit ? '*' : ''}`),
    shellChildren: () => root().querySelector('ha-card.shell')?.children.length ?? 0
  };
  window.ready = true;
</script>
</body>
</html>
