name: Bug report
description: Something renders or behaves wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove or replace real entity ids, URLs and addresses before pasting anything.
  - type: input
    id: version
    attributes:
      label: HouseView version
      description: Shown in the browser console banner, or in the release you installed.
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version and frontend (browser, wall tablet, companion app)
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Card configuration
      description: The YAML of the failing card, with entity ids anonymised.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Browser console output
      description: Errors from the developer tools console, if any.
      render: text
