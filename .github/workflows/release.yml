name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Tag must equal v<package.json version> and CHANGELOG.md must have a section for it.
      # (dist is checked again after the production build below.)
      - name: Tag, version and changelog agree
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "tag $GITHUB_REF_NAME != package.json v$VERSION"; exit 1; }
          grep -Eq "^##[[:space:]]+\[?v?${VERSION//./\\.}\]?" CHANGELOG.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }

      - run: npm run gen:check
      - run: npm run gen-docs:check
      - run: npm run lint
      - run: npm run check:widgets
      - run: npm run check:overviews
      - run: npm run test:unit
      - run: npm run build:dev
      - run: npm run test:browser
      - run: npm run test:widgets
      - run: npm run test:overviews
      - run: npm run test:overviews:input

      - name: Production build
        run: npm run build

      - run: npm run size

      - name: Verify and stage release assets
        run: node tools/release.mjs --tag="$GITHUB_REF_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          case "$GITHUB_REF_NAME" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/release/houseview.js \
            dist/release/houseview.js.map dist/release/houseview.js.sha256 \
            --title "HouseView ${GITHUB_REF_NAME#v}" --notes-file dist/release/NOTES.md $FLAGS
