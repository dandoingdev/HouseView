<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000">
<!-- Original folded ribbon geometry, authored for HouseView. -->
<defs>
 <linearGradient id="ground" x2="1" y2="1"><stop stop-color="#063f40"/><stop offset=".5" stop-color="#146c69"/><stop offset="1" stop-color="#093f42"/></linearGradient>
 <linearGradient id="fold"><stop stop-color="#042f35"/><stop offset=".42" stop-color="#268a83"/><stop offset=".53" stop-color="#75c4b5"/><stop offset=".59" stop-color="#247d78"/><stop offset="1" stop-color="#0b4a4e"/></linearGradient>
 <linearGradient id="edge" x2="0" y2="1"><stop stop-color="#9ddbd0" stop-opacity=".7"/><stop offset=".45" stop-color="#1b7f79"/><stop offset="1" stop-color="#053d42"/></linearGradient>
 <pattern id="weave" width="600" height="500" patternUnits="userSpaceOnUse" patternTransform="rotate(-15)">
